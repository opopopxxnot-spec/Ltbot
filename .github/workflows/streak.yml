name: LeetCode Daily Streak Bot

on:
  schedule:
    # Multi-schedule redundancy (Primary + 2 automatic fallback passes if earlier runs hit network issues)
    - cron: "30 0 * * *"   # 00:30 UTC (06:00 IST) — Primary run right after daily reset
    - cron: "30 6 * * *"   # 06:30 UTC (12:00 IST) — Afternoon safety check
    - cron: "30 14 * * *"  # 14:30 UTC (20:00 IST) — Evening emergency pass before day ends
  push:
    paths:
      - 'bot.py'
      - '.github/workflows/**'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: leetcode-streak-bot
  cancel-in-progress: false

jobs:
  solve-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Auto-Solver Bot (with auto-retry)
        env:
          LC_USERNAME: ${{ secrets.LC_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRF_TOKEN: ${{ secrets.CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET_LANG: "cpp"
        run: |
          MAX_RUNS=2
          for i in $(seq 1 $MAX_RUNS); do
            echo "🚀 Bot Execution Attempt $i/$MAX_RUNS..."
            if python bot.py; then
              echo "✅ Bot finished successfully."
              exit 0
            fi
            if [ $i -lt $MAX_RUNS ]; then
              echo "⚠️ Run attempt $i encountered an issue. Waiting 30s before auto-retrying..."
              sleep 30
            fi
          done
          echo "❌ Bot failed all run attempts."
          exit 1

      - name: Auto-commit streak log and solutions
        run: |
          git config user.name "leetcode-bot"
          git config user.email "bot@streak.dev"
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p logs
          echo "✅ Daily challenge attempted on $DATE" >> logs/streak.log
          git add logs/ solutions/
          if ! git diff --cached --quiet; then
            git commit -m "🔥 streak: $DATE daily challenge"
            git pull --rebase origin main || true
            git push origin main
          fi
