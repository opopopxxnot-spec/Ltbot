name: LeetCode Daily Streak Bot

on:
  schedule:
    # Runs every day at 00:30 UTC (06:00 IST) — right after LeetCode's daily reset
    - cron: "30 0 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  solve-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Auto-Solver Bot
        env:
          LC_USERNAME: ${{ secrets.LC_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRF_TOKEN: ${{ secrets.CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET_LANG: "cpp"
        run: python bot.py

      - name: Auto-commit streak log and solutions
        run: |
          git config user.name "leetcode-bot"
          git config user.email "bot@streak.dev"
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p logs
          echo "✅ Daily challenge attempted on $DATE" >> logs/streak.log
          git add logs/ solutions/
          git diff --cached --quiet || git commit -m "🔥 streak: $DATE daily challenge"
          git push
